:root{
  /* how much height the slide actually gets. the notes drawer shrinks it, and
     everything that sizes off the viewport reads this instead of 100vh. */
  --vh:100vh;
  --dark:#0B0B0C;
  --cream:#F3EFEA;
  --white:#FFFFFF;
  --ink:#1F2A44;
  --ink-soft:#6B6560;
  --on-dark:#FFFFFF;
  --on-dark-soft:rgba(255,255,255,.62);
  --coral:#FF7235; --blush:#FF5E7E; --pink:#FF4D6D;
  --grad:linear-gradient(90deg,#FF7235 0%,#FF5E7E 48%,#FF4D6D 100%);
  --face:"Google Sans Medium","Google Sans Text","Google Sans",Figtree,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#F6F2EC;transition:background-color .7s var(--e-big);color:var(--ink);
  font-family:var(--face);font-weight:500;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ── stage ───────────────────────────────────────────────── */
.deck{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
/* The SLIDE fills the screen - ground, wash and shapes all run edge to edge,
   at any window shape. The composition lives in .frame, a 16:9 box centred
   inside it, which is also the container that every cqw in this file measures
   against. On a 16:9 screen the two are the same rectangle. On anything taller
   or wider, the extra goes to the background rather than to the type - the
   deck looks immersive without the headlines inflating. */
.s{
  position:absolute;inset:0;
  overflow:hidden;
  display:none;
  isolation:isolate;
}
.s.on{display:block}
.frame{
  position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:min(100vw, calc(var(--vh) * 1.7778));
  height:min(56.25vw, var(--vh));
  container-type:inline-size;
}
.s-feature{background:transparent;color:var(--ink)}
.s-cream{background:transparent;color:var(--ink)}

.inner{
  position:absolute;inset:0;z-index:3;
  padding:9cqw 9cqw 11cqw;
  display:flex;flex-direction:column;justify-content:center;
}

/* ── shared type ─────────────────────────────────────────── */
.kick{
  font-family:var(--mono);font-size:1.35cqw;font-weight:400;
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--pink);margin-bottom:2.2cqw;display:block;
}
.s-feature .kick{color:var(--coral)}
.s h2{
  font-size:6.2cqw;line-height:1.08;letter-spacing:-.018em;
  font-weight:500;margin:0;text-wrap:balance;max-width:22em;
}
.s .sub{
  font-size:2.2cqw;line-height:1.5;font-weight:400;
  color:var(--ink-soft);margin:2.6cqw 0 0;max-width:38em;
}
.s-feature .sub{color:var(--ink-soft)}
.s em{font-style:normal;color:var(--pink)}

/* ── title slide ─────────────────────────────────────────── */
/* The title composition is a precise recreation, so it stays locked to 16:9
   inside .frame. Only the two colour bands and the wash are full-bleed - they
   are gradients, they can be any shape - and their split is computed off the
   frame's own height so the horizon still lines up with the logo rail. */
.s-title{
  --fh:min(var(--vh), 56.25vw);
  --split:calc(var(--vh)/2 - var(--fh)/2 + var(--fh)*0.74815);
  background:linear-gradient(to bottom,#FAF7F2 0 var(--split),#FFFCF8 var(--split) 100%);
}
.tl-wash{
  position:absolute;left:0;top:0;width:100%;
  height:calc(var(--vh)/2 - var(--fh)/2 + var(--fh)*0.7463);
  background:
   radial-gradient(58% 78% at 6% -6%,   rgba(255,114,53,.50), rgba(255,114,53,0) 62%),
   radial-gradient(34% 46% at 20% 6%,   rgba(255,182,66,.34), rgba(255,182,66,0) 68%),
   radial-gradient(44% 66% at 97% 0%,   rgba(255,77,109,.42), rgba(255,77,109,0) 66%),
   radial-gradient(38% 58% at 80% 46%,  rgba(255,94,126,.26), rgba(255,94,126,0) 70%),
   radial-gradient(48% 52% at 33% 96%,  rgba(255,114,53,.22), rgba(255,114,53,0) 72%);
}

   620-unit box lands on the same visual weight as the rails and the spectrum
   rule, which is what keeps them reading as one family.                     */
.dgm{margin-top:4cqw;max-width:62cqw}
.dg-narrow{max-width:54cqw}

         stroke-linecap:round;stroke-linejoin:round}
.dg-box{fill:none;stroke:var(--ink);stroke-width:3}

/* three forces: one diagram that persists across five slides, with only the
   emphasis moving. the filled portion is where the force is now; the hollow
   dot ahead of it is where it is heading. */
.rails{display:flex;flex-direction:column;gap:2.6cqw;max-width:56cqw;margin-top:4.4cqw}
.rail{display:grid;grid-template-columns:15cqw 1fr;align-items:center;gap:2.2cqw;
      opacity:.3;transition:opacity .6s var(--e-dec)}
.rail.lit{opacity:1}
.rail-l{font-family:var(--mono);font-size:1.15cqw;letter-spacing:.18em;
        text-transform:uppercase;color:var(--ink-soft);text-align:right;line-height:1.3}
.rail.lit .rail-l{color:var(--ink)}
.rail-t{position:relative;height:.34cqw;border-radius:1cqw;background:rgba(40,32,26,.14);
        overflow:visible}
/* one number, --p, positions all three parts - see float.py */
.rail-f{position:absolute;left:0;top:0;height:100%;width:var(--p);border-radius:1cqw;
        background:rgba(40,32,26,.3);transition:background .6s var(--e-dec)}
.rail.lit .rail-f{background:var(--grad)}
.rail-m{position:absolute;top:50%;border-radius:50%;translate:-50% -50%;
        left:var(--p);width:1.4cqw;aspect-ratio:1;background:#FFFCF8;
        border:.26cqw solid rgba(40,32,26,.35)}
.rail.lit .rail-m{border-color:var(--pink)}
/* The ghost dot that used to sit ahead of the marker is gone. A 16px circle
   with a dashed border does not render as a dotted ring - the browser draws
   two or three stray arc fragments, which read as a rendering fault sitting
   in front of the marker. Motion carries "where it's heading" on its own. */

/* ── slide 17: the three pitch icons are alive ─────────────────────
   Each icon animates the ONE part that carries its idea - the prediction
   climbing, the aperture opening, the object being handed over - and nothing
   else. Clocks are 3.4 / 4.1 / 5.3s: non-harmonic, so the row never pulses in
   unison and the loop has no visible seam. Amplitudes are 2-3 units on a 120
   grid, which at slide size is two or three pixels: you register that they're
   breathing without being able to say what moved.

   These rules match elements inside <defs>, which is deliberate - a <use>
   clones them, and CSS matching the original applies to every instance. You
   cannot select into a use's shadow tree from outside, so this is the only
   way to animate part of a shared icon. */
.tr-d1,.tr-d2,.tr-dot,.tr-tail,.ap-b,.ap-dot,.ob-lid,.ob-body{
  transform-box:fill-box;transform-origin:center;
}
/* HOW A CARD BUILDS ITS OWN ICON. Every animation here is gated on
   `.bcard.shown`, which only works because these three icons are INLINE rather
   than <use> instances - selectors do not cross into a use's shadow tree. That
   matters twice over:

   - The animation only EXISTS while the card is shown, so it starts on the
     click and not when the slide is first painted.
   - Removing `.shown` removes the animation outright, so stepping back and
     forward genuinely replays it. An earlier version gated on
     animation-play-state instead, which pauses but never rewinds - and was
     thrown away anyway by the `animation` shorthand on the next line, which
     resets every longhand it does not mention. Keep each of these as ONE
     shorthand declaration and the trap cannot come back. */
.bcard .tr-base,.bcard .tr-line,.bcard .tr-dot,
.bcard .ap-b,.bcard .ap-dot,.bcard .ob-piece{
  transform-box:fill-box;transform-origin:center;
}
.bcard .tr-line{stroke-dasharray:100}
/* 01 - the flat baseline establishes the before, then the line draws and the
   dot rides up it. tr-ride is generated in float.py by sampling the same
   cubic that is in the markup, so the dot cannot drift off its own curve. */
@keyframes tr-fade{from{opacity:0}to{opacity:.3}}
@keyframes tr-draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.bcard.shown .tr-base{animation:tr-fade .3s ease-out both}
.bcard.shown .tr-base-b{animation:tr-fade .3s ease-out .12s both}
.bcard.shown .tr-line{animation:tr-draw .95s cubic-bezier(.3,.7,.3,1) .22s both}
.bcard.shown .tr-dot{animation:tr-ride .95s linear .22s both}
/* 02 - the idea lands, then the space opens around it. The brackets start
   pulled almost to the centre and travel out along their own diagonals. */
@keyframes ap-pop{from{scale:0}60%{scale:1.15}to{scale:1}}
@keyframes ap-tl{from{translate:26px 26px}to{translate:0 0}}
@keyframes ap-tr{from{translate:-26px 26px}to{translate:0 0}}
@keyframes ap-bl{from{translate:26px -26px}to{translate:0 0}}
@keyframes ap-br{from{translate:-26px -26px}to{translate:0 0}}
.bcard.shown .ap-dot{animation:ap-pop .42s cubic-bezier(.3,1.4,.5,1) both}
.bcard.shown .ap-tl{animation:ap-tl .8s cubic-bezier(.2,.8,.25,1) .2s both}
.bcard.shown .ap-tr{animation:ap-tr .8s cubic-bezier(.2,.8,.25,1) .2s both}
.bcard.shown .ap-bl{animation:ap-bl .8s cubic-bezier(.2,.8,.25,1) .2s both}
.bcard.shown .ap-br{animation:ap-br .8s cubic-bezier(.2,.8,.25,1) .2s both}
/* 03 - the piece arrives from below and to the right, straightens, and seats.
   The slight overshoot on the easing is what makes it read as clicking into
   place rather than sliding to a stop. */
@keyframes ob-seat{
  from{translate:26px 30px;rotate:-16deg;scale:.86;opacity:0}
  40%{opacity:1}
  to{translate:0 0;rotate:0deg;scale:1;opacity:1}
}
.bcard.shown .ob-piece{animation:ob-seat .8s cubic-bezier(.25,1.25,.45,1) both}
@media (prefers-reduced-motion:reduce){
  .bcard.shown .tr-base,.bcard.shown .tr-base-b,.bcard.shown .tr-line,
  .bcard.shown .tr-dot,.bcard.shown .ap-dot,.bcard.shown .ap-tl,
  .bcard.shown .ap-tr,.bcard.shown .ap-bl,.bcard.shown .ap-br,
  .bcard.shown .ob-piece{animation:none!important}
  .bcard .tr-line{stroke-dasharray:none}
}

/* ══ floating shapes ═══════════════════════════════════════════
   Timings measured off labs.google:
     ground crossfade   0.7s  cubic-bezier(.65,0,.35,1)
     shape travel       0.9s  cubic-bezier(.65,0,.35,1)
     emphasised decel   0.5s  cubic-bezier(.2,0,0,1)
     micro UI           0.2s  cubic-bezier(.4,0,.2,1)
     float x            7-10.5s   y = x*1.83   r = x*1.45   ease-in-out

   the way their .bg-shapes__slot elements do. They never re-spawn.  */

  --e-big:cubic-bezier(.65,0,.35,1);
  --e-dec:cubic-bezier(.2,0,0,1);

  --e-drift:cubic-bezier(.33,0,.25,1);
}
.shape-defs{position:absolute;width:0;height:0;overflow:hidden}

.stage-shapes{
  /* solid fills, exactly as labs.google renders them.
     ambient: decoupled from slide changes entirely. */
  position:fixed;inset:0;
  container-type:inline-size;
  overflow:hidden;pointer-events:none;z-index:2;
  opacity:0;  /* slide 1 is the title, which owns its own wash. paint() raises it. */
  transition:opacity 1.6s var(--e-drift);
}
.sl{
  /* a centre point. steer.js writes `translate` every frame; the -50% keeps
     the element centred on the coordinate it is given. */
  position:absolute;left:0;top:0;display:block;
  translate:-50% -50%;

.blob{

     computed styles is the pre-entrance state, not the resting one. */
}

@keyframes rise{from{opacity:0;translate:0 .9cqw}to{opacity:1;translate:0 0}}

@media (prefers-reduced-motion:reduce){

.sp-l{
  fill:rgba(31,42,68,.72);
  transition:transform .95s var(--e-dec) var(--dly), fill .95s var(--e-dec) var(--dly);
}
/* the doc is on screen from the start - it is the subject. the single
   click is the edit. */
.dgm:has(.sp-tag.shown) .sp-l{transform:translateY(var(--dy))}
.dgm:has(.sp-tag.shown) .sp-keep{fill:var(--ink)}
.dgm:has(.sp-tag.shown) .sp-drop{fill:rgba(31,42,68,.13)}
@media (prefers-reduced-motion:reduce){.sp-l{transition:none}}

/* ── proof (22) ──────────────────────────────────────────────
   Two columns: the words and the real numbers on the left, the post itself on
   the right as an artifact. It is deliberately not sized to be read - a tweet
   on a slide never is - it is there so the room recognises what it is. */
.pf{display:grid;grid-template-columns:1fr 28cqw;gap:5.4cqw;align-items:center}
.pf-text{min-width:0}
/* The capture is cropped to about 12px of margin on a 1080-wide phone screen -
   roughly one pixel at slide size, so the text runs straight into the edge.
   The card supplies the reading room itself: the same black the post is already
   on, padded around the media, which reads as the screen rather than as a frame
   round a picture. */
.pf-card{
  /* sized by HEIGHT, and the card shrink-wraps the media. sized by width the
     capture came out 41.7cqw tall inside a 38cqw card and overhung its own
     frame top and bottom, which is what read as cropped too close. */
  margin:0 0 0 auto;height:42cqw;width:fit-content;max-width:100%;
  display:flex;align-items:center;justify-content:center;
  background:#000;padding:1.8cqw;border-radius:2cqw;
  box-shadow:0 2cqw 5cqw -1.8cqw rgba(30,22,18,.42);
}
.pf-card img,.pf-card video{
  height:100%;width:auto;max-width:100%;display:block;border-radius:.7cqw;
}
.pf-stat{
  margin-top:2.4cqw;opacity:0;translate:0 1.2cqw;
  transition:opacity .5s var(--e-dec), translate .5s var(--e-dec);
}
.pf-stat.shown{opacity:1;translate:0 0}
.pf-big{
  display:block;font-size:7cqw;line-height:1;letter-spacing:-.03em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  color:transparent;font-variant-numeric:tabular-nums;
}
.pf-k{
  display:block;font-family:var(--mono);font-size:1.2cqw;font-weight:400;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-top:.7cqw;
}
.pf-row{display:flex;gap:4.4cqw;margin-top:2.1cqw}
.pf-sn{display:block;font-size:2.5cqw;line-height:1;letter-spacing:-.01em}
.pf-sk{
  display:block;font-family:var(--mono);font-size:1cqw;font-weight:400;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-top:.6cqw;
}
.pf-src{
  display:block;font-family:var(--mono);font-size:1cqw;font-weight:400;
  letter-spacing:.12em;color:var(--ink-soft);margin-top:1.8cqw;opacity:.8;
}

/* ── presenter notes ─────────────────────────────────────────
   A drawer, not a second window: popup blockers make the two-window
   presenter view unreliable on a strange machine, and this one is a
   keypress. N toggles it, T runs the practice clock. */
.np[hidden]{display:none}   /* .np sets display:flex, which beats the
                                 hidden attribute's own default. the published
                                 wrapper has a !important reset; a standalone
                                 copy of this file does not. */
.np{
  position:fixed;left:0;right:0;bottom:0;z-index:12;
  height:42vh;display:flex;flex-direction:column;
  background:#15120F;color:#F2EDE6;
  box-shadow:0 -1.4rem 3rem -1.4rem rgba(20,14,10,.5);
}
.np-bar{
  display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;
  padding:.75rem 1.5rem .55rem;border-bottom:1px solid rgba(242,237,230,.14);
  font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;
}
.np-cue{text-transform:uppercase;color:#FF8A5C}
.np-clock{font-size:1.1rem;letter-spacing:.04em;color:#F2EDE6;font-variant-numeric:tabular-nums}
.np-next{color:rgba(242,237,230,.5);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:.04em}
.np-hint{color:rgba(242,237,230,.32)}
.np-body{
  padding:1rem 1.5rem 1.4rem;overflow-y:auto;
  font-family:var(--face);font-size:var(--ns,1.15rem);line-height:1.5;font-weight:400;
}
.np-body b.hl{font-weight:700;color:#fff}
.np-body .ck.next{background:#5E9BFF;animation:ckp 1.3s ease-in-out infinite}
.np-body .ck.done{background:rgba(242,237,230,.16);color:rgba(242,237,230,.55)}
@keyframes ckp{50%{opacity:.55}}
.np-go{display:flex;align-items:center;gap:.6rem;margin:.9rem 0 0;color:rgba(242,237,230,.55);font-size:.9rem}
.np-go .ck{margin:0}
.np-peek{opacity:.32;margin-top:1rem;font-size:.85em}
.np-body p{margin:0 0 .85rem;max-width:60em}
.np-land{
  border-left:3px solid #FF4D6D;padding-left:.9rem;font-weight:500;
}
.np-land b{
  display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;
  text-transform:uppercase;color:#FF6B85;margin-bottom:.3rem;font-weight:400;
}
.np-dir{
  color:rgba(242,237,230,.55);font-style:italic;font-size:1rem;
}
/* ── slide 30: the two bars redraw on the click ─────────────────────
   Curiosity carries the gradient, building is dull grey - the bright one is
   the half that survived. One :has() on the step marker drives both bars and
   all three caption swaps, so nothing can arrive out of step with anything
   else. Widths transition on the same clock the rest of the deck uses. */
.ratio{max-width:62cqw;position:relative}
.rt-go{display:block;height:0}
.rt-when{
  display:block;font-family:var(--mono);font-size:1.25cqw;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink);position:relative;height:1.8cqw;
}
.rt-row{
  display:grid;grid-template-columns:13cqw 1fr 17cqw;align-items:center;
  gap:2cqw;margin-top:2cqw;
}
.rt-l{
  font-family:var(--mono);font-size:1.15cqw;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink);
}
.rt-t{
  position:relative;height:2.4cqw;border-radius:1.2cqw;
  background:rgba(40,32,26,.09);
}
.rt-f{
  position:absolute;left:0;top:0;height:100%;width:var(--a);border-radius:1.2cqw;
  transition:width 1.15s var(--e-dec);
}
.rt-cur .rt-f{background:var(--grad)}
.rt-bld .rt-f{background:rgba(40,32,26,.22)}
/* captions crossfade in place, so the row never reflows mid-animation */
.rt-c{position:relative;display:block;height:1.7cqw}
.rt-c b,.rt-when b{
  position:absolute;left:0;top:0;font-weight:400;white-space:nowrap;
  transition:opacity .5s var(--e-dec);
}
.rt-c b{
  font-family:var(--mono);font-size:1.05cqw;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(40,32,26,.45);
}
.rt-n{opacity:0}
.ratio:has(.rt-go.shown) .rt-f{width:var(--b)}
.ratio:has(.rt-go.shown) .rt-p{opacity:0}
.ratio:has(.rt-go.shown) .rt-n{opacity:1}
.ratio:has(.rt-go.shown) .rt-cur .rt-n{color:var(--pink)}
@media (prefers-reduced-motion:reduce){
  .rt-f,.rt-c b,.rt-when b{transition:none}
}
/* The click cue, inline in the sentence at the word she clicks on. Sized in
   em so it tracks whatever type size the note is set at, in the drawer and in
   the presenter window alike. */
.ck{
  display:inline-block;margin:0 .22em;padding:.14em .6em .18em;border-radius:1em;
  background:#FF4D6D;color:#fff;font-family:var(--mono);font-size:.58em;
  letter-spacing:.14em;text-transform:uppercase;font-style:normal;font-weight:700;
  white-space:nowrap;translate:0 -.1em;
}
/* with the drawer open the slide sits in the space above it. --vh is what
   makes the composition follow: the frame is sized off it, not off 100vh. */
body.has-notes{--vh:58vh}
body.has-notes .deck,body.has-notes .stage-shapes{bottom:42vh}
body.has-notes .hud{bottom:calc(42vh + 1.1rem)}
body.has-notes .bar{bottom:42vh}

/* ── the 2017 -> now grid ────────────────────────────────────
   Pinned to the same spot on both slides, and out of the flex flow, so the
   composition above it can differ while the grid itself does not move. That
   is what lets the change read as one grid lighting up. */
.dg-anchor{position:absolute;left:9cqw;bottom:7cqw;width:43cqw;margin:0}
/* the grid is out of the flow, so the words above have to be told it is there.
   centring them in the remaining box still overflowed onto it on slide 2, which
   carries the taller block - top-aligning both is what actually clears it. */
.s-grid .inner{justify-content:flex-start}
.gc{
  transform-box:fill-box;transform-origin:center;
  animation:gcell .46s var(--e-dec) var(--d) both;
}
@keyframes gcell{from{opacity:0;scale:.68}to{opacity:1;scale:1}}
.gl{animation:gfade .5s var(--e-dec) .62s both}
@keyframes gfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .gc,.gl{animation:none}
}

.toast{
  position:fixed;left:50%;bottom:2.2rem;translate:-50% 0;z-index:20;
  background:#15120F;color:#F2EDE6;padding:.75rem 1.1rem;border-radius:10px;
  font-size:.9rem;max-width:34rem;box-shadow:0 1rem 2rem -1rem rgba(20,14,10,.6);
}
/* ── float, transcribed from labs.google ─────────────────────────────
   Three keyframes per shape - x, y and rotation - on non-harmonic clocks
   (y = x * 1.83, r = x * 1.45), each started mid-cycle with a negative delay
   so nothing begins from rest. Labs composes them with
   `animation-composition: add` on one element; three nested wrappers get the
   same result without depending on that.

.rot4{animation:fr4 12.32s ease-in-out -5.8s infinite}

  const cur=document.getElementById('cur'), fill=document.getElementById('fill');
  const pips=document.getElementById('pips');
  const TONE=["feature", "title", "feature"];
  const GROUND={feature:'#EDE6DC',cream:'#F6F2EC',image:'#EDE6DC',title:'#FAF7F2'};
  const bg=document.getElementById('bg');
  // The shapes are never repositioned. A slide change touches the ground tone
  // and nothing else - that reaction was the jarring part.
  function paint(n){
    const t=TONE[n]||'cream';
    document.body.style.backgroundColor=GROUND[t]||'#F6F2EC';
    bg.style.opacity=(t==='title')?0:1;
  }
  function show(n){
    i=Math.max(0,Math.min(slides.length-1,n)); pg=0; pk=0;
    slides.forEach((s,k)=>s.classList.toggle('on',k===i));
    slides.forEach(s=>s.querySelectorAll('[data-count]').forEach(el=>{
      if(!s.classList.contains('on')){delete el.dataset.ran; el.textContent='0.0';}
    }));
    // the clip starts from the top every time she lands on the slide
    slides[i].querySelectorAll('video').forEach(v=>{
      try{v.currentTime=0;}catch(e){} v.play().catch(()=>{});
    });
    cur.textContent=i+1;
    fill.style.width=((i+1)/slides.length*100)+'%';
    paint(i);
    paintNotes();
    pushPres();
    try{location.hash=i+1;}catch(e){}
  }
  // ── click-to-build: a slide with data-step items advances inside itself ──
  let st=0, pg=0, pk=0;   // build step, notes page, clicks consumed on that page
  const steps=s=>{const e=[...s.querySelectorAll('[data-step]')];
    return e.length?Math.max(...e.map(x=>+x.dataset.step)):0;};
  // A real number, revealed. It counts to 24.1 and stops - the figure is off
  // the post itself, and there is no claim here about the shape of the climb.
  const EASE=k=>1-Math.pow(1-k,3);
  function runCounts(){
    slides[i].querySelectorAll('.shown [data-count]').forEach(el=>{
      if(el.dataset.ran) return; el.dataset.ran='1';
      const to=+el.dataset.count, t0=performance.now(), d=1500;
      (function tick(t){
        const k=Math.min(1,(t-t0)/d);
        el.textContent=(to*EASE(k)).toFixed(1);
        if(k<1) requestAnimationFrame(tick);
      })(t0);
    });
  }
  function paintSteps(){
    slides[i].querySelectorAll('[data-step]').forEach(e=>{
      e.classList.toggle('shown', +e.dataset.step<=st);
    });
    runCounts();
    const t=steps(slides[i]);
    pips.innerHTML = t ? Array.from({length:t},(_,k)=>
      `<i class="${k<st?'on':''}"></i>`).join('') : '';
  }
  // ── notes pages ──────────────────────────────────────────────────
  // Each slide's notes are cut into short pages so the laptop never shows
  // more than a couple of lines. → turns the page. A page that carries a
  // [[CLICK]] builds the slide on that press (a click at the very start of
  // a page fires as the page turns). The last page hands off to the next
  // slide. Director lines (>>) ride along with the page before them.
  const PAGE_WORDS=26;
  const wc=t=>t.split(/\s+/).filter(Boolean).length;
  const lead=pg_=>!!pg_&&pg_.text.startsWith('[[CLICK]]');
  function paginate(n){
    const pages=[]; let pend=[];
    const push=(text,kind)=>{pages.push({text,kind,pre:pend,dir:[],
      clicks:(text.match(/\[\[CLICK\]\]/g)||[]).length}); pend=[];};
    for(const p of n.paras){
      if(p.startsWith('>> ')){ if(pages.length) pages[pages.length-1].dir.push(p.slice(3)); else pend.push(p.slice(3)); continue; }
      const kind=p.startsWith('LAND: ')?'land':'p';
      const body=kind==='land'?p.slice(6):p;
      let cur='';
      const units=[];
      for(let x of body.split(/(?<=[.!?])\s+(?=[A-Z"\u201c\[(])/)){
        x=x.trim(); if(!x) continue;
        if(wc(x)<=PAGE_WORDS+4){ units.push(x); continue; }
        // a sentence too long for one page: break it at clause boundaries
        let c='';
        for(const part of x.split(/(?<=,|;|\s-)\s+/)){
          if(c && wc(c)+wc(part)>PAGE_WORDS){ units.push(c); c=''; }
          c=c?c+' '+part:part;
        }
        if(c) units.push(c);
      }
      for(const x of units){
        if(cur && wc(cur)+wc(x)>PAGE_WORDS){ push(cur,kind); cur=''; }
        cur=cur?cur+' '+x:x;
      }
      if(cur) push(cur,kind);
    }
    if(!pages.length) push('','p');
    if(pend.length) pages[pages.length-1].dir.push(...pend);
    return pages;
  }
  const stepOf=()=>{const P=PAGES[i]||[]; let c=0; for(let q=0;q<pg;q++) c+=P[q].clicks;
    return Math.min(c+pk, steps(slides[i]));};
  function paintPage(){ st=stepOf(); paintSteps(); paintNotes(); pushPres(); }
  function go(d){
    const P=PAGES[i]||[]; const cur=P[pg]||{clicks:0,text:''};
    if(d>0){
      if(pk<cur.clicks){pk++; paintPage(); return;}
      if(pg<P.length-1){pg++; pk=lead(P[pg])?1:0; paintPage(); return;}
      const t=steps(slides[i]); if(st<t){st++;paintSteps();return;}   // more builds than clicks
      if(i+1>=slides.length) return;
      pg=0; pk=0; show(i+1); pk=lead((PAGES[i]||[])[0])?1:0; st=stepOf(); paintSteps(); paintNotes(); pushPres();
    } else {
      if(pk>(lead(cur)?1:0)){pk--; paintPage(); return;}
      if(pg>0){pg--; pk=P[pg].clicks; paintPage(); return;}
      if(st>0){st--;paintSteps();return;}
      if(i-1<0) return;
      show(i-1); const Q=PAGES[i]||[]; pg=Math.max(0,Q.length-1); pk=(Q[pg]||{clicks:0}).clicks; st=steps(slides[i]); paintSteps(); paintNotes(); pushPres();
    }
  }
  window.__pgdbg=()=>({slide:i+1,pg,pk,st,pages:(PAGES[i]||[]).length});
  document.addEventListener('keydown',e=>{
    if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(1);}
    if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
    if(e.key==='Home'){show(0);} if(e.key==='End'){show(slides.length-1);}
    if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFS();}
    if(e.key==='n'||e.key==='N'){
      e.preventDefault();
      np.hidden=!np.hidden;
      document.body.classList.toggle('has-notes',!np.hidden);
      if(!np.hidden) paintNotes();
    }
    if(e.key==='t'||e.key==='T'){e.preventDefault();timer(t0===null);}
    if(e.key==='p'||e.key==='P'){e.preventDefault();openPres();}
    if(e.key==='+'||e.key==='='){e.preventDefault();notesSize(1);}
    if(e.key==='-'||e.key==='_'){e.preventDefault();notesSize(-1);}
  });
  // ── notes text size: + and - in either window, remembered between runs ──
  let nsf=1; try{nsf=parseFloat(localStorage.getItem('notes-size'))||1;}catch(e){}
  function applyNotesSize(){
    document.documentElement.style.setProperty('--ns',(1.3*nsf).toFixed(3)+'rem');
    if(pres&&!pres.closed) pres.document.documentElement.style.setProperty('--ns',(1.6*nsf).toFixed(3)+'rem');
  }
  function notesSize(d){
    nsf=Math.min(2.2,Math.max(0.7,Math.round((nsf+d*0.1)*10)/10));
    try{localStorage.setItem('notes-size',nsf);}catch(e){}
    applyNotesSize();
  }
  // ── immersion: real full screen, and chrome that gets out of the way ──
  function toggleFS(){
    const d=document.documentElement;
    if(document.fullscreenElement) document.exitFullscreen?.();
    else d.requestFullscreen?.().catch(()=>{});
  }
  document.getElementById('fs').onclick=e=>{e.stopPropagation();toggleFS();};
  const hud=document.getElementById('hud'), bar=document.querySelector('.bar');
  let idle;
  function wake(){
    hud.classList.remove('away'); bar.classList.remove('away');
    document.body.style.cursor='';
    clearTimeout(idle);
    idle=setTimeout(()=>{
      hud.classList.add('away'); bar.classList.add('away');
      document.body.style.cursor='none';
    }, 2600);
  }
  ['mousemove','keydown','touchstart','click'].forEach(ev=>
    document.addEventListener(ev, wake, {passive:true}));
  wake();
  document.querySelector('.next').onclick=()=>go(1);
  document.querySelector('.prev').onclick=()=>go(-1);
  deck.addEventListener('click',e=>{
    if(e.target.closest('.hud'))return;
    go(e.clientX > innerWidth*0.5 ? 1 : -1);
  });
  let x0=null;
  deck.addEventListener('touchstart',e=>x0=e.changedTouches[0].clientX,{passive:true});
  deck.addEventListener('touchend',e=>{
    if(x0===null)return; const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>45) go(dx<0?1:-1); x0=null;
  },{passive:true});
  // Chromium will not decode a megabyte-scale data: URI on a media element -
  // readyState stays 0 and nothing ever loads. The bytes ride in a script tag
  // and become a blob URL here, which media elements do accept.
  // ── presenter window ──────────────────────────────────────────────
  // A second window she puts on the laptop while the deck is on the projector.
  // Written straight into an about:blank popup rather than served from a URL,
  // so it is same-origin and scriptable with no second file to keep in sync.
  let pres=null;
  function pushPres(){
    if(!pres || pres.closed) return;
    const d=pres.document, n=NOTES[i]; if(!n) return;
    d.getElementById('cue').textContent=n.cue;
    d.getElementById('pos').textContent=(i+1)+' / '+slides.length+' \u00b7 page '+(pg+1)+'/'+(PAGES[i]||[]).length;
    d.getElementById('body').innerHTML=renderPage('');
    d.getElementById('next').innerHTML = (i+1<HEADS.length && HEADS[i+1])
      ? '<b>Next</b>'+esc(HEADS[i+1]) : '<b>Next</b>-';
    d.getElementById('body').scrollTop=0;
    presClock();
  }
  function presClock(){
    if(!pres || pres.closed) return;
    pres.document.getElementById('clock').textContent =
      (t0===null) ? '00:00' : fmt(Date.now()-t0);
  }
  function openPres(){
    if(pres && !pres.closed){ pres.focus(); return; }
    pres = window.open('', 'deck-notes', 'width='+Math.min(screen.availWidth,1600)+',height='+screen.availHeight+',left=0,top=0');
    if(!pres){ toast('Pop-up blocked - allow pop-ups for this page, or press N for the drawer.'); return; }
    pres.document.write("<!doctype html><html><head><meta charset=\"utf-8\">\n<title>Speaker notes</title>\n<style>\n*{box-sizing:border-box}\nhtml,body{height:100%;margin:0}\nbody{background:#15120F;color:#F2EDE6;font:400 17px/1.55 -apple-system,\n     BlinkMacSystemFont,\"Segoe UI\",Helvetica,Arial,sans-serif;\n     display:flex;flex-direction:column;overflow:hidden}\n.bar{display:flex;align-items:baseline;gap:1.4rem;flex-wrap:wrap;\n     padding:.9rem 1.6rem .7rem;border-bottom:1px solid rgba(242,237,230,.14);\n     font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;\n     letter-spacing:.1em}\n.cue{text-transform:uppercase;color:#FF8A5C}\n.clock{font-size:1.5rem;letter-spacing:.03em;font-variant-numeric:tabular-nums}\n.pos{color:rgba(242,237,230,.55)}\n.hint{margin-left:auto;color:rgba(242,237,230,.3);text-align:right}\nmain{flex:1;overflow-y:auto;padding:1.5rem 1.6rem 2rem}\nmain p{margin:0 0 1rem;max-width:52em;font-size:var(--ns,1.35rem);line-height:1.5}\nmain b.hl{font-weight:700;color:#fff}\n.ck.next{background:#5E9BFF;animation:ckp 1.3s ease-in-out infinite}\n.ck.done{background:rgba(242,237,230,.16);color:rgba(242,237,230,.55)}\n@keyframes ckp{50%{opacity:.55}}\n.go{display:flex;align-items:center;gap:.7rem;margin:1.4rem 0 0;color:rgba(242,237,230,.55);font-size:1rem}\n.go .ck{font-size:.7rem;margin:0}\n.peek{opacity:.32;margin-top:1.8rem;font-size:calc(var(--ns,1.6rem)*.78)!important;max-width:52em}\n.land{border-left:3px solid #FF4D6D;padding-left:1rem;font-weight:600}\n.land b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:.62rem;\n        letter-spacing:.2em;text-transform:uppercase;color:#FF6B85;\n        margin-bottom:.35rem;font-weight:400}\n.dir{color:rgba(242,237,230,.55);font-style:italic;font-size:calc(var(--ns,1.35rem)*.82)}\n.ck{display:inline-block;margin:0 .22em;padding:.14em .6em .18em;\n    border-radius:1em;background:#FF4D6D;color:#fff;\n    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.58em;\n    letter-spacing:.14em;text-transform:uppercase;font-style:normal;\n    font-weight:700;white-space:nowrap;translate:0 -.1em}\n.next{border-top:1px solid rgba(242,237,230,.14);padding:.8rem 1.6rem 1rem;\n      font-size:.95rem;color:rgba(242,237,230,.5)}\n.next b{font-family:ui-monospace,Menlo,monospace;font-size:.62rem;\n        letter-spacing:.2em;text-transform:uppercase;color:rgba(242,237,230,.35);\n        display:block;margin-bottom:.25rem;font-weight:400}\n.nav{display:flex;gap:.6rem;padding:0 1.6rem 1.1rem}\n.nav button{flex:1;appearance:none;border:1px solid rgba(242,237,230,.2);\n  background:rgba(242,237,230,.05);color:#F2EDE6;border-radius:10px;\n  padding:.7rem;font-size:1rem;cursor:pointer}\n.nav button:hover{background:rgba(242,237,230,.12)}\n</style></head><body>\n<div class=\"bar\"><span class=\"cue\" id=\"cue\"></span>\n  <span class=\"clock\" id=\"clock\">00:00</span>\n  <span class=\"pos\" id=\"pos\"></span>\n  <span class=\"hint\">&#8592; &#8594; move the deck &middot; T timer &middot; + &minus; text size</span></div>\n<main id=\"body\"></main>\n<div class=\"next\" id=\"next\"></div>\n<div class=\"nav\"><button id=\"prev\">&#8592; Back</button>\n  <button id=\"next-btn\">Next &#8594;</button></div>\n</body></html>");
    pres.document.close();
    const d=pres.document;
    d.getElementById('prev').onclick=()=>go(-1);
    d.getElementById('next-btn').onclick=()=>go(1);
    d.addEventListener('keydown', e=>{
      if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(1);}
      if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
      if(e.key==='t'||e.key==='T'){e.preventDefault();timer(t0===null);}
      if(e.key==='p'||e.key==='P'){e.preventDefault();openPres();}
      if(e.key==='+'||e.key==='='){e.preventDefault();notesSize(1);}
      if(e.key==='-'||e.key==='_'){e.preventDefault();notesSize(-1);}
    });
    applyNotesSize();
    pres.addEventListener('beforeunload',()=>{pres=null;});
    pushPres();
  }
  function toast(msg){
    const el=document.createElement('div');
    el.textContent=msg; el.className='toast';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 5200);
  }
  window.addEventListener('beforeunload',()=>{ if(pres&&!pres.closed) pres.close(); });

  // One branch, two builds. The split build ships a filename map and the
  // video just gets an src - the browser then fetches only the encode it can
  // play, and only when the slide asks it to. The single-file build has no
  // map, falls through, and decodes its base64 into a blob exactly as before.
  const VSRC = (()=>{ const el=document.getElementById('vid-src');
    try { return el ? JSON.parse(el.textContent) : null; } catch(e) { return null; } })();
  document.querySelectorAll('video[data-vid]').forEach(v=>{
    const webm = v.canPlayType('video/webm; codecs="vp9"');
    const pick = webm ? ['webm','video/webm'] : ['mp4','video/mp4'];
    if(VSRC && VSRC[v.dataset.vid]){
      // Deliberately NOT calling play() here. preload='none' is pointless if
      // something asks the video to start, and this loop runs for every clip
      // in the deck at startup - which pulled 1.3MB before slide one had
      // finished painting. show() already plays the videos on the slide she
      // is actually on, and it runs after this, so a deep link still works.
      v.preload='none';
      v.src=VSRC[v.dataset.vid][pick[0]];
      v.muted=true;
      return;
    }
    const raw = document.getElementById(v.dataset.vid+'-'+pick[0]);
    if(!raw) return;
    const bin=atob(raw.textContent.trim());
    const arr=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) arr[k]=bin.charCodeAt(k);
    v.src=URL.createObjectURL(new Blob([arr],{type:pick[1]}));
    v.muted=true; v.play().catch(()=>{});
    raw.remove();
  });
  // ── presenter notes ───────────────────────────────────────────────
  // The full narrative per slide, straight from the script. Hidden until N,
  // so the deck is still a deck; the clock is for practice runs.
  const NOTES=[{"cue": "Open", "paras": ["Cover. Replace the working title once the talk has one."]}, {"cue": "Open", "paras": ["Hi everyone. I'm Jaclyn, a product director at Google Labs."]}, {"cue": "Close", "paras": ["Thank you."]}], HEADS=["The AI Conference, 2026", "", "Thank you"];
  const PAGES=NOTES.map(paginate);
  const np=document.getElementById('np'), npb=document.getElementById('npbody'),
        npc=document.getElementById('npcue'), npn=document.getElementById('npnext'),
        npk=document.getElementById('npclock');
  let t0=null, tick=null;
  const fmt=ms=>{const s=Math.floor(ms/1000);
    return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
  function clock(){
    if(t0!==null) npk.textContent=fmt(Date.now()-t0);
    presClock();
  }
  function timer(on){
    clearInterval(tick);
    if(on){ t0=Date.now(); tick=setInterval(clock,250); clock(); }
    else { t0=null; npk.textContent='00:00'; presClock(); }
  }
  function paintNotes(){
    const n=NOTES[i]; if(!n) return;
    npc.textContent=n.cue+' \u00b7 '+(pg+1)+'/'+(PAGES[i]||[]).length;
    npn.textContent = i+1<HEADS.length && HEADS[i+1] ? 'Next: '+HEADS[i+1] : '';
    npb.innerHTML = renderPage('np-');
  }
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  // ── the click cue lives IN the sentence ───────────────────────────
  // A cue parked at the top of a note is useless by the time she is three
  // lines in. [[CLICK]] in notes.py is written at the exact word she should
  // click on, and becomes an inline pill here. Function declaration, not a
  // const, because pushPres() calls it from higher up the file.
  function renderPage(P){
    const pages=PAGES[i]||[]; const page=pages[pg]||{text:'',kind:'p',clicks:0,pre:[],dir:[]};
    let k=0;
    const bold=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b class="hl">$1</b>');
    const mark=t=>bold(t).replace(/\[\[CLICK\]\]/g,()=>{
      k++; const c=k<=pk?'ck done':(k===pk+1?'ck next':'ck'); return '<i class="'+c+'">click</i>';
    });
    const dirs=a=>a.map(d=>'<p class="'+P+'dir">'+bold(d).replace(/\[\[CLICK\]\]/g,'<i class="ck">click</i>')+'</p>').join('');
    let h=dirs(page.pre||[]);
    h+= page.kind==='land' ? '<p class="'+P+'land"><b>Land this</b>'+mark(page.text)+'</p>' : '<p>'+mark(page.text)+'</p>';
    h+=dirs(page.dir||[]);
    let what=null;
    if(pk>=page.clicks) what = pg<pages.length-1 ? 'next line' : (i+1<slides.length ? 'next slide' : null);
    if(what) h+='<p class="'+P+'go"><i class="ck next">click</i><span>'+what+'</span></p>';
    const nx=pages[pg+1];
    if(nx) h+='<p class="'+P+'peek">'+bold(nx.text).replace(/\[\[CLICK\]\]/g,'<i class="ck">click</i>')+'</p>';
    return h;
  }
  function renderNote(n, P){
    const total=(n.paras.join(' ').match(/\[\[CLICK\]\]/g)||[]).length;
    let k=0;
    const mark=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b class="hl">$1</b>').replace(/\[\[CLICK\]\]/g,()=>{
      k++; return '<i class="ck">'+(total>1?'click '+k:'click')+'</i>';
    });
    return n.paras.map(p=>{
      if(p.startsWith('LAND: '))
        return '<p class="'+P+'land"><b>Land this</b>'+mark(p.slice(6))+'</p>';
      if(p.startsWith('>> '))
        return '<p class="'+P+'dir">'+mark(p.slice(3))+'</p>';
      return '<p>'+mark(p)+'</p>';
    }).join('');
  }
  applyNotesSize();
  const start=parseInt(location.hash.slice(1),10);
  show(Number.isFinite(start)&&start>0?start-1:0);
  st=0; paintSteps();
})();
</script>
<script>/* ── ambient shapes: a placement system, not a choreography ───────────
   The shapes used to run fixed CSS paths. That meant their positions had to be
   solved by hand against the worst-case slide, and the only way to guarantee
   they never crossed the type was to park them mostly off-frame - where they
   read as wedges sliced by the edge.

   This replaces the paths with rules, in two layers.

   SEEK decides WHERE a shape should be. Every slide puts different things on
   screen, so the free space is different every time; the shape scores a grid of
   candidate points by how much clearance each one has from the actual content
   and from the frame edges, subtracts a penalty for crowding the other shapes
   and another for travelling far, and takes the best. That is re-run on a slide
   change and every few seconds, so nothing is ever pinned.

   DRIFT decides how it gets there and what it does once it arrives: it eases
   toward the target and then orbits it slowly, on its own clock, so it is never
   still and never repeats. A speed cap means it eases rather than darts.

   Because the whole thing is continuous and time-based rather than triggered,
   it does not care how fast she moves through the deck. A slide change just
   changes the obstacles; the shapes drift out of the way over the next second
   or two instead of jumping.                                                  */

(function () {
  const EL = [...document.querySelectorAll('.sl')];
  if (!EL.length) return;
  const stage = document.getElementById('bg');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // What counts as content. Read live from the DOM rather than declared per
  // slide, so an empty slide gives the shapes the room and a dense one pushes
  // them to the margins, with no table to keep in sync.
  // What counts as content. Text is measured as INK - the client rects of the
  // text runs themselves - not as element boxes: an h2's box is the full column
  // width even when the headline is three words, and treating that as solid was
  // what left the shapes with nowhere to stand. Everything that is not text
  // (diagrams, images, tiles) is taken as its box, because for those it is.
  // NB .tl-track is deliberately absent: it is a full-bleed wrapper with
  // inset:0, so taking its box declared the whole title slide solid. The
  // logo marks and nodes inside it are the actual content.
  const BOXES = '.dgm,.tile,.pf-card,.s-image img,.shot img,.chat img,.tl-portrait,.mk,.nd,' +
                '.bcard .ic,.hi-ic';
  const INK   = 'h2,.q,.sub,.kick,.num,.attrib,.li-h,.li-b,.col p,.col-k,.spec-end,' +
                '.bc-t,.bc-b,.bc-n,.cap,.tl-name,.tl-role,.tl-n,.tl-k,.pf-big,.pf-k,' +
                '.pf-sn,.pf-sk,.pf-src';

  const PAD   = 20;     // px of air to keep between a shape and any content
  const EDGE  = 12;     // px of air to keep at the frame edge
  const OVER  = 0.5;      // how much of a shape may hang off the frame -
                        // the stage clips it, so it reads as drifting in
                        // from off-screen rather than bouncing off a wall
  const SEEK  = 5.0;    // how hard it steers toward its chosen spot
  const DAMP  = 0.88;   // velocity retained per 60fps frame
  const VMAX  = 260;    // px/s - about a second and a half across the
                        // frame. slower than this and a shape spends most
                        // of its life in transit ACROSS the type.
  const ORBIT = 34;     // px, the idle wander once it has arrived
  const EVERY = 4.5;    // s between routine re-picks
  const COLS = 26, ROWS = 15;   // candidate grid

  const S = EL.map((el, n) => ({
    el, n, x: 0, y: 0, vx: 0, vy: 0, r: 40,
    tx: null, ty: null, urg: 0,
    ph: Math.random() * 6.283,             // orbit phase
    sp: 0.30 + n * 0.055,                  // and its own orbit rate
    age: n * 1.1                           // stagger the first re-picks
  }));

  let obstacles = [], W = 0, H = 0, lastSlide = null;

  function measure() {
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    const slide = document.querySelector('.s.on');
    obstacles = [];
    if (!slide) return;
    const vis = el => { const cs = getComputedStyle(el);
                        return cs.opacity !== '0' && cs.visibility !== 'hidden'; };
    for (const el of slide.querySelectorAll(BOXES)) {
      if (!vis(el)) continue;
      const b = el.getBoundingClientRect();
      if (b.width > 2 && b.height > 2) obstacles.push(b);
    }
    for (const el of slide.querySelectorAll(INK)) {
      if (!vis(el)) continue;
      for (const node of el.childNodes) {
        if (node.nodeType !== 3 || !node.textContent.trim()) continue;
        const rg = document.createRange(); rg.selectNodeContents(node);
        for (const b of rg.getClientRects())
          if (b.width > 2 && b.height > 2) obstacles.push(b);
      }
      // nested inline spans (the gradient <span class="hl">) carry their own runs
      for (const sp of el.querySelectorAll('span,em,b')) {
        if (!vis(sp)) continue;
        const b = sp.getBoundingClientRect();
        if (b.width > 2 && b.height > 2) obstacles.push(b);
      }
    }
    const np = document.getElementById('np');
    if (np && !np.hidden) obstacles.push(np.getBoundingClientRect());
  }

  // How much room is there at (x,y)? Distance to the nearest content edge,
  // and to the frame edge, whichever is closer.
  function clearance(x, y, r = 0) {
    let m = Math.min(x, y, W - x, H - y) + r * OVER + PAD;
    for (const o of obstacles) {
      const cx = Math.max(o.left, Math.min(x, o.right));
      const cy = Math.max(o.top, Math.min(y, o.bottom));
      const d = Math.hypot(x - cx, y - cy);
      if (d < m) m = d;
    }
    return m;
  }

  function retarget(s) {
    const need = s.r + PAD;
    const cap  = need + 24;          // past this, extra room stops mattering
    let best = null, bestScore = -1e9;
    for (let gx = 0; gx < COLS; gx++) {
      for (let gy = 0; gy < ROWS; gy++) {
        const ov = s.r * OVER;
        const x = -ov + (gx + 0.5) / COLS * (W + 2 * ov);
        const y = -ov + (gy + 0.5) / ROWS * (H + 2 * ov);
        let score = Math.min(clearance(x, y, s.r), cap);
        if (score < need) score -= (need - score) * 6;      // hard no
        score += (Math.random() - 0.5) * 30;                  // roam
        for (const o of S) {
          if (o === s || o.tx === null) continue;
          const want = s.r + o.r + 40;
          const d = Math.hypot(x - o.tx, y - o.ty);
          if (d < want) score -= (want - d) * 0.9;
        }
        // Travel is expensive: a shape in transit crosses whatever is
        // between here and there. Weighted so a far pocket has to be a lot
        // better to be worth the trip, which keeps the moves short and local.
        score -= Math.hypot(x - s.x, y - s.y) * 0.22;
        // A shape in transit crosses whatever lies between here and there, so
        // score the ROUTE too: sample along it and charge for every step that
        // would pass over content.
        for (let t = 0.2; t < 1; t += 0.2) {
          const px = s.x + (x - s.x) * t, py = s.y + (y - s.y) * t;
          const c = clearance(px, py, s.r);
          if (c < s.r) score -= (s.r - c) * 0.55;
        }
        if (score > bestScore) { bestScore = score; best = [x, y]; }
      }
    }
    s.tx = best[0]; s.ty = best[1]; s.age = 0;
  }

  function stepOnce(dt) {
    for (const s of S) {
      s.r = s.el.getBoundingClientRect().width / 2 || s.r;
      s.age += dt;
      // re-pick on a timer, or the moment its spot stops being clear
      if (s.tx === null || clearance(s.x, s.y, s.r) < s.r + PAD * 0.6 ||
          (s.age > EVERY && clearance(s.x, s.y, s.r) < s.r + PAD * 1.8))
        retarget(s);

      // Urgency. Being caught under new content is the one moment worth
      // hurrying for: the shape clears out briskly and then goes back to
      // drifting, rather than sliding out at ambient speed while she talks
      // over the top of it.
      if (clearance(s.x, s.y, s.r) < s.r + PAD) s.urg = 1;
      else s.urg = Math.max(0, s.urg - dt / 0.7);
      const seek = SEEK * (1 + s.urg * 2.2);
      const vmax = VMAX * (1 + s.urg * 2.0);

      // the point it is actually heading for: its target, plus a slow orbit
      s.ph += dt * s.sp;
      const gx = s.tx + Math.cos(s.ph) * ORBIT;
      const gy = s.ty + Math.sin(s.ph * 1.37) * ORBIT;

      let ax = (gx - s.x) * seek, ay = (gy - s.y) * seek;

      // A local shove as well, so a shape crossing the slide is pushed off
      // anything it passes over rather than ploughing straight through it.
      for (const o of obstacles) {
        const cx = Math.max(o.left - PAD, Math.min(s.x, o.right + PAD));
        const cy = Math.max(o.top - PAD, Math.min(s.y, o.bottom + PAD));
        const dx = s.x - cx, dy = s.y - cy;
        const d = Math.hypot(dx, dy);
        if (d > s.r || d < 0.001) continue;
        const k = (1 - d / s.r) * 420;
        ax += dx / d * k; ay += dy / d * k;
      }

      // separation, in case two are converging on the same gap
      for (const o of S) {
        if (o === s) continue;
        const dx = s.x - o.x, dy = s.y - o.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const want = s.r + o.r + 24;
        if (d < want) { const k = (want - d) / want * 300;
                        ax += dx / d * k; ay += dy / d * k; }
      }

      s.vx = (s.vx + ax * dt) * Math.pow(DAMP, dt * 60);
      s.vy = (s.vy + ay * dt) * Math.pow(DAMP, dt * 60);
      const sp = Math.hypot(s.vx, s.vy);
      if (sp > vmax) { s.vx *= vmax / sp; s.vy *= vmax / sp; }
      s.x += s.vx * dt; s.y += s.vy * dt;
      // a hard clamp, so no frame can ever leave one clipped by the edge
      s.x = Math.max(s.r * (1 - OVER), Math.min(W - s.r * (1 - OVER), s.x));
      s.y = Math.max(s.r * (1 - OVER), Math.min(H - s.r * (1 - OVER), s.y));
    }
  }

  const draw = () => S.forEach(s => {
    s.el.style.translate =
      `calc(${s.x.toFixed(1)}px - 50%) calc(${s.y.toFixed(1)}px - 50%)`;
  });

  function settle(n) {
    measure();
    S.forEach(s => { s.r = s.el.getBoundingClientRect().width / 2 || s.r;
                     s.tx = null; });
    for (let k = 0; k < n; k++) stepOnce(1 / 60);
    draw();
  }

  // first placement: spread them, then let the rules sort it out
  measure();
  S.forEach((s, n) => {
    const c = [[0.10, 0.18], [0.90, 0.24], [0.11, 0.82], [0.89, 0.78]][n % 4];
    s.x = c[0] * W; s.y = c[1] * H;
  });
  settle(200);

  let last = 0;
  function frame(t) {
    const dt = Math.min(0.05, last ? (t - last) / 1000 : 0.016);
    last = t;
    measure();
    const now = document.querySelector('.s.on');
    if (now !== lastSlide) {
      lastSlide = now;
      // only the shapes whose spot the new slide has taken need to move
      for (const s of S) if (clearance(s.x, s.y, s.r) < s.r + PAD) retarget(s);
    }
    stepOnce(dt);
    draw();
    requestAnimationFrame(frame);
  }
  if (!reduce) requestAnimationFrame(frame);

  addEventListener('resize', () => settle(150));
  window.__shapesSettle = settle;          // the harness drives this
  window.__obs = () => { measure(); return obstacles; };
  window.__dbg = () => { measure(); return S.map(s=>({n:s.n,
    r:Math.round(s.r), x:Math.round(s.x), y:Math.round(s.y),
    tx:s.tx===null?null:Math.round(s.tx), ty:s.ty===null?null:Math.round(s.ty),
    clrAt:Math.round(clearance(s.x,s.y,s.r)),
    clrTgt:s.tx===null?null:Math.round(clearance(s.tx,s.ty,s.r))})); };
})();
</script>

</body>
</html>
